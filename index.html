<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Camera nền xuyên thấu chiếm trọn màn hình */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Lớp vẽ khung ảnh AR & hạt hiệu ứng */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Màn hình khởi động để xin quyền Camera */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .start-btn {
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 99px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.6);
      cursor: pointer;
      transition: transform 0.2s ease;
      letter-spacing: 0.5px;
    }
    .start-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Màn hình chạm để mở -->
  <div id="start-overlay">
    <h2 style="margin-bottom: 12px; font-size: 1.5rem;">✨ Bật Trải Nghiệm AR ✨</h2>
    <p style="color: #ddd; margin-bottom: 25px; font-size: 0.95rem;">Nhấn nút bên dưới để mở khung AR qua camera</p>
    <button class="start-btn" id="start-btn">Khám Phá Ngay</button>
  </div>

  <!-- Camera thiết bị -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Khung Canvas AR chuyển động -->
  <canvas id="ar-canvas"></canvas>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('ar-canvas');
    const ctx = canvas.getContext('2d');

    // Nạp ảnh khung viền PNG của bạn
    const overlayImg = new Image();
    overlayImg.src = './my-image.png';

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Hạt lấp lánh (Sparkles & Stars)
    const sparkles = [];
    for (let i = 0; i < 20; i++) {
      sparkles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: 3 + Math.random() * 5,
        speedY: 0.5 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        color: ['#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9'][Math.floor(Math.random() * 5)]
      });
    }

    // Khởi động Camera sau
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startOverlay.style.display = 'none';
        requestAnimationFrame(renderLoop);
      } catch (err) {
        alert('Vui lòng cấp quyền truy cập Camera để tiếp tục!');
      }
    }

    startBtn.addEventListener('click', startCamera);

    // Vòng lặp chuyển động mượt mà
    let time = 0;
    function renderLoop() {
      time += 0.035;
      ctx.clearRect(0, 0, width, height);

      // --- 1. Hiệu ứng các hạt bay trôi nổi xung quanh ---
      for (const sp of sparkles) {
        sp.y -= sp.speedY;
        if (sp.y < -20) sp.y = height + 10;
        const alpha = 0.5 + 0.5 * Math.sin(time * 2 + sp.phase);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x + Math.sin(time + sp.phase) * 15, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // --- 2. Tính toán chuyển động cho toàn bộ khung ảnh ---
      // Lắc lư nhẹ sang 2 bên
      const offsetX = Math.sin(time * 1.2) * 10;
      // Nhún nhảy lên xuống rõ ràng hơn
      const offsetY = Math.cos(time * 1.5) * 14;
      // Góc nghiêng lắc lư theo nhịp
      const rotation = Math.sin(time * 0.9) * 0.02;
      // Hiệu ứng thở (nhịp đập phóng to/thu nhỏ nhẹ)
      const scale = 1.02 + Math.sin(time * 2.0) * 0.025;

      // --- 3. Vẽ ảnh PNG Full Màn Hình ---
      if (overlayImg.complete && overlayImg.naturalWidth !== 0) {
        ctx.save();
        ctx.translate(width / 2 + offsetX, height / 2 + offsetY);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);

        // Canh chỉnh khung ảnh full vừa khít màn hình điện thoại (object-fit: contain)
        const imgAspect = overlayImg.naturalWidth / overlayImg.naturalHeight;
        const screenAspect = width / height;

        let drawW, drawH;
        if (screenAspect > imgAspect) {
          drawH = height;
          drawW = height * imgAspect;
        } else {
          drawW = width;
          drawH = width / imgAspect;
        }

        ctx.drawImage(overlayImg, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
