<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Đổi nền thành màu trắng sạch sẽ, trang nhã */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Canvas hiển thị ảnh bồng bềnh + pháo giấy + hạt sáng -->
  <canvas id="ar-canvas"></canvas>

  <script>
    const canvas = document.getElementById('ar-canvas');
    const ctx = canvas.getContext('2d');

    // Nạp ảnh PNG
    const overlayImg = new Image();
    overlayImg.src = './my-image.png';

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Hạt bụi sáng lấp lánh (Sparkles)
    const sparkles = [];
    for (let i = 0; i < 22; i++) {
      sparkles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: 3 + Math.random() * 5,
        speedY: 0.6 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        color: ['#ff85a1', '#f72585', '#7209b7', '#4cc9f0', '#ffb703', '#fb8500'][Math.floor(Math.random() * 6)]
      });
    }

    // 2. Pháo hoa giấy (Confetti)
    let confettiList = [];
    const confettiColors = ['#ff0a54', '#ff477e', '#ff7096', '#7209b7', '#3a0ca3', '#4cc9f0', '#06d6a0', '#ffd166', '#f72585'];

    function launchConfetti() {
      const pieceCount = 180;
      const originX = width / 2;
      const originY = height * 0.7; // Nổ trào lên từ phía dưới

      for (let i = 0; i < pieceCount; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI * 0.95);
        const speed = 12 + Math.random() * 20;
        confettiList.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.38 + Math.random() * 0.2,
          drag: 0.96,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 15,
          width: 8 + Math.random() * 8,
          height: 12 + Math.random() * 10,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          alpha: 1,
          decay: 0.005 + Math.random() * 0.006
        });
      }
    }

    // Bắn pháo ngay khi trang vừa tải xong
    window.addEventListener('load', () => {
      launchConfetti();
    });
    // Gọi thêm 1 lần phòng trường hợp ảnh nạp nhanh
    launchConfetti();

    // Chạm vào màn hình bất cứ lúc nào cũng bắn thêm đợt pháo giấy mới
    window.addEventListener('pointerdown', (e) => {
      for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 12;
        confettiList.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.35,
          drag: 0.96,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 15,
          width: 8 + Math.random() * 6,
          height: 10 + Math.random() * 8,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          alpha: 1,
          decay: 0.008 + Math.random() * 0.006
        });
      }
    });

    // Vòng lặp chuyển động mượt mà
    let time = 0;
    function renderLoop() {
      time += 0.035;
      ctx.clearRect(0, 0, width, height);

      // --- Hiệu ứng 1: Bụi sao bay trôi nổi ---
      for (const sp of sparkles) {
        sp.y -= sp.speedY;
        if (sp.y < -20) sp.y = height + 10;
        const alpha = 0.5 + 0.5 * Math.sin(time * 2 + sp.phase);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x + Math.sin(time + sp.phase) * 15, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // --- Hiệu ứng 2: Khung ảnh nhún nhảy, lắc lư bồng bềnh ---
      const offsetX = Math.sin(time * 1.2) * 10;
      const offsetY = Math.cos(time * 1.5) * 14;
      const rotation = Math.sin(time * 0.9) * 0.02;
      const scale = 1.02 + Math.sin(time * 2.0) * 0.025;

      if (overlayImg.complete && overlayImg.naturalWidth !== 0) {
        ctx.save();
        ctx.translate(width / 2 + offsetX, height / 2 + offsetY);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);

        // Canh vừa vặn toàn màn hình
        const imgAspect = overlayImg.naturalWidth / overlayImg.naturalHeight;
        const screenAspect = width / height;

        let drawW, drawH;
        if (screenAspect > imgAspect) {
          drawH = height;
          drawW = height * imgAspect;
        } else {
          drawW = width;
          drawH = width / imgAspect;
        }

        ctx.drawImage(overlayImg, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
      }

      // --- Hiệu ứng 3: Pháo giấy nổ tung và rơi bồng bềnh ---
      for (let i = confettiList.length - 1; i >= 0; i--) {
        const c = confettiList[i];
        c.vx *= c.drag;
        c.vy *= c.drag;
        c.vy += c.gravity;
        c.x += c.vx;
        c.y += c.vy;
        c.rotation += c.rotationSpeed;
        c.alpha -= c.decay;

        if (c.alpha <= 0 || c.y > height + 50) {
          confettiList.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.width / 2, -c.height / 2, c.width, c.height);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  </script>
</body>
</html>
