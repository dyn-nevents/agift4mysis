<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Game Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    /* Camera nền xuyên thấu */
    #camera-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Khung vẽ hiệu ứng AR */
    #ar-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }

    /* Nút bắt đầu (bắt buộc để trình duyệt xin quyền Camera & Âm thanh) */
    #start-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      background: radial-gradient(circle, #2b1055, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .btn-start {
      margin-top: 25px;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
      cursor: pointer;
    }

    /* Thanh điều khiển kiểu game */
    #controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: none;
      gap: 10px;
    }
    .btn-mode {
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .btn-mode.active {
      background: #00f2fe;
      color: #000;
      font-weight: bold;
      border-color: #00f2fe;
    }
  </style>
</head>
<body>

  <!-- Màn hình chào -->
  <div id="start-screen">
    <h1 style="font-size: 2rem; margin-bottom: 10px;">✨ AR Pop Experience ✨</h1>
    <p style="color: #ccc; font-size: 0.95rem;">Chạm để bật camera và bắt đầu chơi cùng nhân vật!</p>
    <button class="btn-start" id="btn-start">Bắt Đầu Ngay</button>
  </div>

  <!-- Video camera thực tế -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Canvas hiển thị nhân vật chuyển động & hạt sáng -->
  <canvas id="ar-canvas"></canvas>

  <!-- Nút chọn kiểu di chuyển -->
  <div id="controls">
    <button class="btn-mode active" data-mode="bounce">Bung lụa</button>
    <button class="btn-mode" data-mode="orbit">Quỹ đạo</button>
    <button class="btn-mode" data-mode="wander">Bay bổng</button>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const btnStart = document.getElementById('btn-start');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('ar-canvas');
    const ctx = canvas.getContext('2d');
    const controls = document.getElementById('controls');
    const modeButtons = document.querySelectorAll('.btn-mode');

    // Nạp ảnh PNG của bạn
    const img = new Image();
    img.src = './my-image.png'; // Tên file ảnh PNG trong cùng thư mục

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Biến trạng thái vật thể AR
    let mode = 'bounce';
    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;
    let vx = 3.5;
    let vy = 3;
    let baseSize = 130;
    let angle = 0;
    let scaleX = 1;
    let scaleY = 1;
    let particles = [];
    let isSpinning = false;
    let spinProgress = 0;
    let orbitAngle = 0;

    // Âm thanh tổng hợp bằng Web Audio (không cần nạp file mp3)
    let audioCtx = null;
    function playBoingSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch(e) {}
    }

    // Hiệu ứng hạt bắn ra khi nảy hoặc chạm
    function spawnParticles(px, py, count = 12) {
      for (let i = 0; i < count; i++) {
        const rad = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        particles.push({
          x: px, y: py,
          vx: Math.cos(rad) * spd,
          vy: Math.sin(rad) * spd,
          life: 1,
          size: 4 + Math.random() * 6,
          color: `hsl(${Math.random() * 360}, 100%, 65%)`
        });
      }
    }

    // Bật Camera sau
    async function startAR() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startScreen.style.display = 'none';
        controls.style.display = 'flex';
        requestAnimationFrame(updateLoop);
      } catch (err) {
        alert('Vui lòng cấp quyền truy cập Camera để xem AR!');
      }
    }

    btnStart.addEventListener('click', () => {
      startAR();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    });

    // Chuyển chế độ chuyển động
    modeButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
      });
    });

    // Chạm vào màn hình để tương tác giật nảy / nhào lộn
    window.addEventListener('pointerdown', (e) => {
      const dist = Math.hypot(e.clientX - x, e.clientY - y);
      if (dist < baseSize) {
        isSpinning = true;
        spinProgress = 0;
        playBoingSound();
        spawnParticles(x, y, 20);
        // Đổi hướng bay ngẫu nhiên
        vx = (Math.random() - 0.5) * 8;
        vy = (Math.random() - 0.5) * 8;
      }
    });

    // Vòng lặp cập nhật Game Loop
    let wanderTimer = 0;
    function updateLoop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Logic chuyển động
      if (mode === 'bounce') {
        x += vx;
        y += vy;
        const half = baseSize / 2;
        if (x - half < 0) { x = half; vx *= -1; spawnParticles(x, y); playBoingSound(); scaleX = 0.7; scaleY = 1.3; }
        if (x + half > width) { x = width - half; vx *= -1; spawnParticles(x, y); playBoingSound(); scaleX = 0.7; scaleY = 1.3; }
        if (y - half < 0) { y = half; vy *= -1; spawnParticles(x, y); playBoingSound(); scaleX = 1.3; scaleY = 0.7; }
        if (y + half > height) { y = height - half; vy *= -1; spawnParticles(x, y); playBoingSound(); scaleX = 1.3; scaleY = 0.7; }
        angle = Math.sin(Date.now() / 200) * 0.15;
      } else if (mode === 'orbit') {
        orbitAngle += 0.03;
        const rx = width * 0.32;
        const ry = height * 0.2;
        x = width / 2 + Math.cos(orbitAngle) * rx;
        y = height / 2 + Math.sin(orbitAngle) * ry;
        angle = orbitAngle;
      } else if (mode === 'wander') {
        wanderTimer += 0.02;
        x = width / 2 + Math.sin(wanderTimer * 1.5) * (width * 0.3);
        y = height / 2 + Math.cos(wanderTimer * 0.8) * (height * 0.25);
        angle = Math.sin(wanderTimer * 2) * 0.2;
      }

      // Hồi phục kích thước (squash & stretch recovery)
      scaleX += (1 - scaleX) * 0.1;
      scaleY += (1 - scaleY) * 0.1;

      // Xoay 360 độ khi người dùng chạm trúng
      let renderAngle = angle;
      if (isSpinning) {
        spinProgress += 0.15;
        renderAngle += spinProgress * Math.PI * 2;
        if (spinProgress >= 1) isSpinning = false;
      }

      // 2. Vẽ bụi hạt lấp lánh (Particles)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // 3. Vẽ ảnh PNG nhân vật AR
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(renderAngle);
      ctx.scale(scaleX, scaleY);

      if (img.complete && img.naturalWidth !== 0) {
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawW = baseSize * aspect;
        const drawH = baseSize;
        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      } else {
        // Dự phòng khi ảnh chưa nạp xong: vẽ vòng tròn neon tạm thời
        ctx.fillStyle = '#00f2fe';
        ctx.beginPath();
        ctx.arc(0, 0, baseSize / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(updateLoop);
    }
  </script>
</body>
</html>
